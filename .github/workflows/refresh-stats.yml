name: Refresh stats

on:
  schedule:
    # Tuesdays 12:00 UTC, after Monday Night Football
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ESPN stats
        run: node scripts/fetch-stats.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Refresh stats $(date -u +%Y-%m-%d)"
          git push
